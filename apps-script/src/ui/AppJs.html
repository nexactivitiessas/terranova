function humano(v) { return String(v || '').replace(/_/g, ' ').toLowerCase().replace(/^./, function (x) { return x.toUpperCase(); }); }

function badge(estado) {
  var s = String(estado || '');
  var color = /RECHAZ|ERROR|VENCIDA|CRITICA|ANULAD|BLOQUE|INACTIVO|DESVINC/.test(s) ? 'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-300'

    : 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
  return '<span class="inline-block px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ' + color + '">' + esc(humano(s)) + '</span>';
}

function formatear(col, v) {
  if (v === '' || v === null || v === undefined) return '<span class="text-slate-400">—</span>';
  if (!col) return esc(v);
  if (col.nombre === 'estado' || col.nombre === 'severidad' || col.nombre === 'etapa') return badge(v);
  if (col.tipo === 'moneda') return '<span class="tabular-nums whitespace-nowrap">' + esc(moneda(v)) + '</span>';
  if (col.tipo === 'fecha' || col.tipo === 'fechahora') return '<span class="whitespace-nowrap">' + esc(fecha(v)) + '</span>';
  if (col.tipo === 'bool') return v ? 'Sí' : 'No';
  if (col.tipo === 'ref' && ESTADO.refs[col.ref] && ESTADO.refs[col.ref][v]) return esc(ESTADO.refs[col.ref][v]);
  if (col.nombre === 'url' || col.nombre === 'enlace' || /_url$/.test(col.nombre)) { var u = urlSegura(v); return u ? '<a class="text-marca underline" target="_blank" rel="noopener" href="' + esc(u) + '">Abrir</a>' : esc(v); }
  var s = String(v);
  return esc(s.length > 80 ? s.slice(0, 80) + '…' : s);
}

// ---------- Arranque y sesión ----------
var $ = function (id) { return document.getElementById(id); };
function guardarToken(t) { SESION.token = t; try { t ? sessionStorage.setItem('pfi_t', t) : sessionStorage.removeItem('pfi_t'); } catch (e) {} }
window.alExpirarSesion = function () { guardarToken(''); mostrarAcceso('formLogin'); aviso('Su sesión expiró. Ingrese nuevamente.', 'info'); };

function mostrarAcceso(form) {
  $('vistaApp').classList.add('hidden'); $('vistaAcceso').classList.remove('hidden');
  ['formLogin', 'formOlvido', 'formReset', 'formCambio'].forEach(function (f) { $(f).classList.toggle('hidden', f !== form); });
}

function iniciar() {
  var m = location.hash.match(/reset=([a-f0-9]{32,})/);
  if (m) { ESTADO.resetToken = m[1]; history.replaceState(null, '', location.pathname + location.search); return mostrarAcceso('formReset'); }
  var t = ''; try { t = sessionStorage.getItem('pfi_t') || ''; } catch (e) {}
  if (!t) return mostrarAcceso('formLogin');
  SESION.token = t;
  cargarPerfil();
}

function cargarPerfil() {
  llamar('auth.yo').then(function (r) {
    SESION.usuario = r.usuario; SESION.menu = r.menu;
    if (r.usuario.debe_cambiar_password) return mostrarAcceso('formCambio');
    entrarApp();
  }).catch(function (e) { mostrarAcceso('formLogin'); if (e.codigo !== 'SESION') aviso(e.mensaje, 'error'); });
}

$('formLogin').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var d = datosForm(this);
  llamar('auth.login', d, { sinToken: true }).then(function (r) { guardarToken(r.token); cargarPerfil(); })
    .catch(function (e) { aviso(e.mensaje, 'error'); });
});
$('lnkOlvido').onclick = function () { mostrarAcceso('formOlvido'); };
Array.prototype.forEach.call(document.querySelectorAll('.volverLogin'), function (b) { b.onclick = function () { mostrarAcceso('formLogin'); }; });
$('formOlvido').addEventListener('submit', function (ev) {
  ev.preventDefault();
  llamar('auth.solicitarRecuperacion', datosForm(this), { sinToken: true }).then(function (r) { aviso(r.mensaje, 'ok'); mostrarAcceso('formLogin'); })
    .catch(function (e) { aviso(e.mensaje, 'error'); });
});
$('formReset').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var d = datosForm(this);
  if (d.password !== d.password2) return aviso('Las contraseñas no coinciden.', 'error');
  llamar('auth.confirmarRecuperacion', { token: ESTADO.resetToken, password: d.password }, { sinToken: true })
    .then(function () { aviso('Contraseña actualizada. Ya puede ingresar.', 'ok'); mostrarAcceso('formLogin'); })
    .catch(function (e) { aviso(e.mensaje, 'error'); });
});
$('formCambio').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var d = datosForm(this);
  if (d.nueva !== d.nueva2) return aviso('Las contraseñas no coinciden.', 'error');
  llamar('auth.cambiarPassword', { actual: d.actual, nueva: d.nueva }).then(function () { aviso('Contraseña actualizada.', 'ok'); this && this.reset && this.reset(); cargarPerfil(); })
    .catch(function (e) { aviso(e.mensaje, 'error'); });
});
$('btnSalir').onclick = function () { llamar('auth.logout', { token: SESION.token }, { sinToken: true }).catch(function () {}); guardarToken(''); location.hash = ''; mostrarAcceso('formLogin'); };

function entrarApp() {
  $('vistaAcceso').classList.add('hidden'); $('vistaApp').classList.remove('hidden');
  $('pieUsuario').innerHTML = esc(SESION.usuario.nombre) + '<br>' + esc(humano(SESION.usuario.rol));
  $('menu').innerHTML = SESION.menu.map(function (m) {
    return '<a href="#/' + esc(m.id) + '" data-vista="' + esc(m.id) + '" class="item-menu">' + esc(m.titulo) + '</a>';
  }).join('');
  var puedeFid = SESION.menu.some(function (m) { return m.id === 'fideicomisos'; });
  if (puedeFid) {
    llamar('datos.listar', { hoja: 'PROYECTOS', tamanio: 200 }).then(function (r) {
      ESTADO.refs.PROYECTOS = {};
      r.registros.forEach(function (p) { ESTADO.refs.PROYECTOS[p.id] = p.denominacion; });
      $('filtroProyecto').innerHTML = '<option value="">Todos los fideicomisos</option>' + r.registros.map(function (p) {
        return '<option value="' + esc(p.id) + '">' + esc(p.denominacion) + '</option>'; }).join('');
      $('filtroProyecto').classList.remove('hidden');
    }).catch(function () {});

  route();
}
$('filtroProyecto').onchange = function () { ESTADO.proyecto = this.value; route(); };
$('btnSidebar').onclick = function () { $('sidebar').classList.remove('-translate-x-full'); $('velo').classList.remove('hidden'); };
$('velo').onclick = cerrarSidebar;
function cerrarSidebar() { $('sidebar').classList.add('-translate-x-full'); $('velo').classList.add('hidden'); }
window.addEventListener('hashchange', function () { if (SESION.usuario) route(); });

function route() {
  cerrarSidebar();
  var id = (location.hash.match(/^#\/([a-z]+)/) || [])[1];
  var permitidos = SESION.menu.map(function (m) { return m.id; });
  if (!id || permitidos.indexOf(id) < 0) id = permitidos[0];
  ESTADO.vista = id;
  Array.prototype.forEach.call(document.querySelectorAll('.item-menu'), function (a) { a.classList.toggle('activo', a.getAttribute('data-vista') === id); });
  var v = V[id];
  $('tituloVista').textContent = v ? v.titulo : '';
  var c = $('contenido');
  c.innerHTML = '<p class="text-slate-500">Cargando…</p>';
  if (!v) { c.innerHTML = '<p>Vista no disponible.</p>'; return; }
  if (v.render) return v.render(c);
  vistaModulo(c, v);
}

// ---------- Vista genérica de módulo ----------
function esquema(hoja) {
  if (ESTADO.esquemas[hoja]) return Promise.resolve(ESTADO.esquemas[hoja]);
  return llamar('datos.esquema', { hoja: hoja }).then(function (e) { ESTADO.esquemas[hoja] = e; return e; });
}

function vistaModulo(c, v) {
  var html = '';
  if (v.aviso) html += '<div class="nota">' + esc(v.aviso) + '</div>';
  if (v.herramientas) html += '<div class="flex flex-wrap gap-2">' + v.herramientas.map(function (h, i) {
    return '<button class="boton-secundario" data-herr="' + i + '">' + esc(h.t) + '</button>'; }).join('') + '</div>';
  if (v.tabs.length > 1) html += '<div class="flex gap-1 overflow-x-auto border-b border-slate-200 dark:border-slate-800" role="tablist">' + v.tabs.map(function (t, i) {
    return '<button role="tab" class="pestana' + (i === 0 ? ' activa' : '') + '" data-tab="' + i + '">' + esc(t.titulo || humano(t.hoja)) + '</button>'; }).join('') + '</div>';
  html += '<div id="zonaTab"></div>';
  c.innerHTML = html;
  Array.prototype.forEach.call(c.querySelectorAll('[data-herr]'), function (b) {
    b.onclick = function () { abrirAccion(v.herramientas[+b.getAttribute('data-herr')], null); };
  });
  Array.prototype.forEach.call(c.querySelectorAll('[data-tab]'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(c.querySelectorAll('[data-tab]'), function (x) { x.classList.remove('activa'); });
      b.classList.add('activa'); renderTab(v.tabs[+b.getAttribute('data-tab')]);
    };
  });
  renderTab(v.tabs[0]);
}

function renderTab(tab, opciones) {
  opciones = opciones || { pagina: 1, busqueda: '' };
  var z = $('zonaTab');
  esquema(tab.hoja).then(function (esq) {
    var puedeCrear = tab.crear || (!esq.soloLectura && !esq.crearPorServicio);
    z.innerHTML = '<div class="flex flex-wrap gap-2 items-center my-4">' +
      '<input id="busqueda" type="search" placeholder="Buscar…" class="flex-1 min-w-[12rem]" value="' + esc(opciones.busqueda) + '">' +
      (puedeCrear ? '<button id="btnNuevo" class="boton-primario">Nuevo</button>' : '') +
      '<button id="btnExportar" class="boton-secundario">Exportar CSV</button></div><div id="tabla" class="tarjeta p-0 overflow-x-auto"></div><div id="paginacion" class="flex justify-between items-center text-sm mt-3"></div>';
    var buscar = $('busqueda'), t;
    buscar.oninput = function () { clearTimeout(t); t = setTimeout(function () { renderTab(tab, { pagina: 1, busqueda: buscar.value }); }, 350); };
    if (puedeCrear) $('btnNuevo').onclick = function () { abrirFormulario(tab, esq, null); };
    $('btnExportar').onclick = function () {
      llamar('datos.exportar', { hoja: tab.hoja, proyecto_id: ESTADO.proyecto }).then(function (r) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['﻿' + r.contenido], { type: 'text/csv;charset=utf-8' }));
        a.download = r.nombre; a.click();
      }).catch(function (e) { aviso(e.mensaje, 'error'); });
    };
    var filtros = tab.filtros || {};
    return llamar('datos.listar', { hoja: tab.hoja, pagina: opciones.pagina, tamanio: 25, busqueda: opciones.busqueda,
      proyecto_id: tab.hoja === 'PROYECTOS' ? '' : ESTADO.proyecto, estado: filtros.estado || '', filtros: filtros, orden: tab.orden || 'creado_en' })
      .then(function (r) { pintarTabla(tab, esq, r, opciones); });
  }).catch(function (e) { z.innerHTML = '<p class="text-red-600">' + esc(e.mensaje) + '</p>'; });
}

function pintarTabla(tab, esq, r, opciones) {
  var cols = (tab.cols || esq.columnas.slice(0, 6).map(function (c) { return c.nombre; }));
  var defs = {}; esq.columnas.forEach(function (c) { defs[c.nombre] = c; });
  ESTADO.registros = {};
  r.registros.forEach(function (x) { ESTADO.registros[x.id] = x; });
  var html = '<table class="tabla"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(etiqueta(c)) + '</th>'; }).join('') + '</tr></thead><tbody>';
  if (!r.registros.length) html += '<tr><td colspan="' + cols.length + '" class="text-center text-slate-500 py-8">Sin registros.</td></tr>';
  r.registros.forEach(function (x) {
    html += '<tr class="cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60" data-id="' + esc(x.id) + '" tabindex="0">' +
      cols.map(function (c) { return '<td>' + formatear(defs[c], x[c]) + '</td>'; }).join('') + '</tr>';
  });
  $('tabla').innerHTML = html + '</tbody></table>';
  Array.prototype.forEach.call($('tabla').querySelectorAll('tr[data-id]'), function (tr) {
    var abrir = function () { abrirDetalle(tab, esq, ESTADO.registros[tr.getAttribute('data-id')]); };
    tr.onclick = abrir; tr.onkeydown = function (e) { if (e.key === 'Enter') abrir(); };
  });
  var paginas = Math.max(1, Math.ceil(r.total / r.tamanio));
  $('paginacion').innerHTML = '<span class="text-slate-500">' + r.total + ' registro(s)</span><span class="flex gap-2">' +
    '<button class="boton-secundario" ' + (r.pagina <= 1 ? 'disabled' : '') + ' id="pagAnt">Anterior</button>' +
    '<span class="px-2 py-1">' + r.pagina + ' / ' + paginas + '</span>' +
    '<button class="boton-secundario" ' + (r.pagina >= paginas ? 'disabled' : '') + ' id="pagSig">Siguiente</button></span>';
  $('pagAnt').onclick = function () { renderTab(tab, { pagina: r.pagina - 1, busqueda: opciones.busqueda }); };
  $('pagSig').onclick = function () { renderTab(tab, { pagina: r.pagina + 1, busqueda: opciones.busqueda }); };
  cargarEtiquetasRef(esq, cols);
}

/** Resuelve ids de referencias a nombres legibles (una consulta por hoja referida). */
function cargarEtiquetasRef(esq, cols) {
  esq.columnas.filter(function (c) { return c.tipo === 'ref' && cols.indexOf(c.nombre) >= 0 && !ESTADO.refs[c.ref]; }).forEach(function (c) {
    ESTADO.refs[c.ref] = {};
    llamar('datos.listar', { hoja: c.ref, tamanio: 200 }).then(function (r) {
      r.registros.forEach(function (x) { ESTADO.refs[c.ref][x.id] = x.denominacion || x.nombre || x.titulo || x.codigo || x.razon_social || x.ubicacion || x.id; });
    }).catch(function () {});
  });
}

function panel(titulo, html) {
  $('panelTitulo').textContent = titulo; $('panelCuerpo').innerHTML = html; $('panel').classList.remove('hidden');
}
function cerrarPanel() { $('panel').classList.add('hidden'); }
Array.prototype.forEach.call(document.querySelectorAll('[data-cerrar]'), function (b) { b.onclick = cerrarPanel; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarPanel(); });

function abrirDetalle(tab, esq, r) {
  var acciones = (tab.acciones || []).filter(function (a) { return !a.si || a.si(r); });
  var html = '<dl class="grid grid-cols-3 gap-x-3 gap-y-2 text-sm">' + esq.columnas.filter(function (c) { return c.nombre !== 'huella'; }).map(function (c) {
    var v = r[c.nombre];
    var val = (c.tipo === 'json' || c.tipo === 'texto') && String(v || '').length > 80 ? '<pre class="whitespace-pre-wrap text-xs">' + esc(c.tipo === 'json' ? bonito(v) : v) + '</pre>' : formatear(c, v);
    return '<dt class="text-slate-500">' + esc(etiqueta(c.nombre)) + '</dt><dd class="col-span-2 break-words">' + val + '</dd>';
  }).join('') + '</dl><div class="mt-6 flex flex-wrap gap-2">';
  if (!esq.soloLectura) html += '<button class="boton-secundario" id="btnEditar">Editar</button><button class="boton-secundario text-red-700" id="btnAnular">Anular</button>';
  acciones.forEach(function (a, i) { html += '<button class="boton-primario" data-acc="' + i + '">' + esc(a.t) + '</button>'; });
  panel(humano(tab.hoja) + ' · ' + (r.denominacion || r.nombre || r.titulo || r.codigo || r.id), html + '</div>');
  if (!esq.soloLectura) {
    $('btnEditar').onclick = function () { abrirFormulario(tab, esq, r); };
    $('btnAnular').onclick = function () {
      var motivo = prompt('Motivo de la anulación (queda registrado en auditoría):');
      if (!motivo) return;
      llamar('datos.anular', { hoja: tab.hoja, id: r.id, motivo: motivo }).then(function () { aviso('Registro anulado.', 'ok'); cerrarPanel(); renderTab(tab); })
        .catch(function (e) { aviso(e.mensaje, 'error'); });
    };
  }
  Array.prototype.forEach.call($('panelCuerpo').querySelectorAll('[data-acc]'), function (b) {
    b.onclick = function () { abrirAccion(acciones[+b.getAttribute('data-acc')], r, tab); };
  });
}
function bonito(v) { try { return JSON.stringify(JSON.parse(v), null, 2); } catch (e) { return v; } }

// ---------- Formularios ----------
function campoHtml(nombre, tipo, etiq, opciones, valor) {
  var id = 'f_' + nombre, v = valor === undefined || valor === null ? '' : valor;
  if (tipo === 'bool') return '<label class="flex items-center gap-2 text-sm"><input type="checkbox" class="w-auto" name="' + esc(nombre) + '"' + (v ? ' checked' : '') + '> ' + esc(etiq) + '</label>';
  var control;
  if (tipo === 'enum') control = '<select id="' + id + '" name="' + esc(nombre) + '"><option value=""></option>' + (opciones || []).map(function (o) {
    return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(humano(o)) + '</option>'; }).join('') + '</select>';
  else if (/^ref:/.test(tipo)) control = '<select id="' + id + '" name="' + esc(nombre) + '" data-ref="' + esc(tipo.slice(4)) + '" data-valor="' + esc(v) + '"><option value="">— cargando —</option></select>';

function objetoHtml(o) {

      var u = porId[b.getAttribute('data-ed')];
      panel('Editar ' + u.email, '<form id="fe" class="space-y-3">' + campoHtml('nombre', 'texto', 'Nombre', null, u.nombre) + campoHtml('rol', 'enum', 'Rol', ROLES_UI, u.rol) +
        campoHtml('estado', 'enum', 'Estado', ['ACTIVO', 'INACTIVO'], u.estado) + campoHtml('proyectos_asignados', 'texto', 'Fideicomisos asignados', null, u.proyectos_asignados) +
        campoHtml('motivo', 'texto', 'Motivo del cambio') + '<button class="boton-primario w-full">Guardar</button></form>');
      $('fe').onsubmit = function (ev) { ev.preventDefault(); var d = datosForm(this); d.id = u.id; d.version = u.version;
        llamar('usuarios.actualizar', d).then(function () { aviso('Usuario actualizado.', 'ok'); cerrarPanel(); vistaUsuarios(c); }).catch(function (e) { aviso(e.mensaje, 'error'); }); };
    }; });
    Array.prototype.forEach.call(c.querySelectorAll('[data-rs]'), function (b) { b.onclick = function () {
      var motivo = prompt('Motivo del reseteo:'); if (!motivo) return;
      llamar('usuarios.resetearPassword', { id: b.getAttribute('data-rs'), motivo: motivo }).then(function (r) {
        panel('Contraseña temporal', '<p class="font-mono text-lg bg-slate-100 dark:bg-slate-800 p-3 rounded select-all">' + esc(r.password_temporal) + '</p><p class="text-sm mt-2">Comuníquela por un canal seguro.</p>'); })
        .catch(function (e) { aviso(e.mensaje, 'error'); });
    }; });
  }).catch(function (e) { c.innerHTML = '<p class="text-red-600">' + esc(e.mensaje) + '</p>'; });
}

// ---------- Configuración ----------
function vistaConfiguracion(c) {
  llamar('configuracion.todas').then(function (r) {
    var desc = {}; r.defectos.forEach(function (d) { desc[d.clave] = d.descripcion; });
    c.innerHTML = '<div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 tarjeta"><h3 class="font-semibold mb-4">Parámetros globales</h3><form id="fc" class="space-y-3">' +
      Object.keys(r.valores).sort().map(function (k) {
        var tipo = /^color_/.test(k) ? 'color' : 'text';
        return '<label class="campo">' + esc(etiqueta(k)) + (desc[k] ? '<span class="text-xs font-normal text-slate-500">' + esc(desc[k]) + '</span>' : '') +
          '<input type="' + tipo + '" name="' + esc(k) + '" value="' + esc(r.valores[k]) + '" data-original="' + esc(r.valores[k]) + '"></label>';
      }).join('') + '<button class="boton-primario">Guardar cambios</button></form></div>' +
      '<div class="space-y-6"><div class="tarjeta text-sm"><h3 class="font-semibold mb-2">Estado del sistema</h3><p>Versión ' + esc(r.version) + '</p><p>Cuota de email restante hoy: ' + esc(r.cuota_email_restante) + '</p><p class="mt-2">WhatsApp: ' + esc(r.whatsapp.mensaje) + '</p></div>' +
      '<div class="tarjeta"><h3 class="font-semibold mb-3">Cambiar mi contraseña</h3><form id="fp" class="space-y-3">' + campoHtml('actual', 'password', 'Actual') + '<label class="campo">Nueva<input type="password" name="nueva" minlength="12" required></label><button class="boton-secundario w-full">Cambiar</button></form></div></div></div>';
    $('fc').onsubmit = function (ev) {
      ev.preventDefault();
      var cambios = Array.prototype.filter.call(this.elements, function (el) { return el.name && el.value !== el.getAttribute('data-original'); });
      if (!cambios.length) return aviso('No hay cambios.', 'info');
      Promise.all(cambios.map(function (el) { return llamar('configuracion.guardar', { clave: el.name, valor: el.value }); }))
        .then(function () { aviso('Configuración guardada. La web pública se actualiza al recargar.', 'ok'); vistaConfiguracion(c); }).catch(function (e) { aviso(e.mensaje, 'error'); });
    };
    $('fp').onsubmit = function (ev) { ev.preventDefault(); llamar('auth.cambiarPassword', datosForm(this)).then(function () { aviso('Contraseña actualizada.', 'ok'); }).catch(function (e) { aviso(e.mensaje, 'error'); }); };
  }).catch(function (e) { c.innerHTML = '<p class="text-red-600">' + esc(e.mensaje) + '</p>'; });
}

// ---------- Portal del beneficiario ----------
function vistaPortal(c) {
  llamar('portal.resumen').then(function (r) {
    var t = r.cuenta.totales, p = r.cuenta.proxima;
    var html = '<div class="tarjeta"><p class="text-sm text-slate-500">Bienvenido/a</p><h3 class="text-xl font-semibold">' + esc(r.beneficiario.nombre) + '</h3><p class="text-sm mt-1">' +
      esc(r.fideicomiso ? r.fideicomiso.denominacion : '') + (r.unidad ? ' · Unidad ' + esc(r.unidad.codigo) : '') + ' · Situación contractual: ' + esc(r.beneficiario.estado_contractual || '—') + '</p></div>' +
      '<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">' + kpi('Total abonado', moneda(t.pagado)) + kpi('Saldo pendiente', moneda(t.saldo)) + kpi('Vencido', moneda(t.vencido)) +
      kpi('Próximo vencimiento', p ? esc(fecha(p.vencimiento)) : '—', p ? 'Cuota ' + p.numero + ' · ' + moneda(p.saldo) : '') + '</div>';
    html += '<div class="grid lg:grid-cols-2 gap-6"><div class="tarjeta"><h4 class="font-semibold mb-3">Avance de obra</h4>' + (r.obra.length ? r.obra.map(function (o) {
      return '<p class="font-medium">' + esc(o.nombre) + '</p>' + barra(o.avance_fisico) + '<p class="text-xs text-slate-500 mb-3">' + esc(o.avance_fisico || 0) + '% certificado</p>' +
        o.etapas.map(function (e) { return '<div class="grid grid-cols-[8rem_1fr_3rem] gap-2 items-center text-xs"><span class="truncate">' + esc(e.nombre) + '</span>' + barra(e.avance) + '<span>' + esc(e.avance || 0) + '%</span></div>'; }).join('');
    }).join('') : '<p class="text-sm text-slate-500">La obra aún no inició.</p>') + '</div>' +
      '<div class="tarjeta"><h4 class="font-semibold mb-3">Acciones</h4><div class="flex flex-wrap gap-2"><button class="boton-primario" id="pInformar">Informar un pago</button><button class="boton-secundario" id="pSolicitud">Nueva consulta</button><button class="boton-secundario" id="pCesion">Solicitar cesión o salida</button></div>' +
      '<h4 class="font-semibold mt-6 mb-2">Comunicaciones</h4>' + (r.comunicaciones.length ? r.comunicaciones.slice(-5).reverse().map(function (n) { return '<div class="text-sm border-l-2 border-marca pl-3 mb-2"><p class="font-medium">' + esc(n.asunto) + '</p><p>' + esc(n.mensaje) + '</p><p class="text-xs text-slate-500">' + esc(fecha(n.fecha)) + '</p></div>'; }).join('') : '<p class="text-sm text-slate-500">Sin comunicaciones.</p>') + '</div></div>';
    html += '<div class="tarjeta"><h4 class="font-semibold mb-3">Cuotas</h4>' + tablaSimple(r.cuenta.cuotas.map(function (q) { return { numero: q.numero, vencimiento: q.vencimiento, importe: q.importe, pagado: q.pagado, saldo: q.saldo, estado: q.estado }; })) + '</div>';
    html += '<div class="tarjeta"><h4 class="font-semibold mb-3">Pagos</h4><div class="overflow-x-auto"><table class="tabla"><thead><tr><th>Fecha</th><th>Importe</th><th>Estado</th><th></th></tr></thead><tbody>' +
      (r.cuenta.pagos.length ? r.cuenta.pagos.map(function (x) { return '<tr><td>' + esc(fecha(x.fecha)) + '</td><td>' + moneda(x.importe) + '</td><td>' + badge(x.estado) + (x.motivo_rechazo ? '<p class="text-xs">' + esc(x.motivo_rechazo) + '</p>' : '') + '</td><td>' + (x.estado === 'ACREDITADO' ? '<button class="boton-secundario" data-recibo="' + esc(x.id) + '">Recibo</button>' : '') + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="text-slate-500">Sin pagos.</td></tr>') + '</tbody></table></div>' +
      '<p class="text-xs text-slate-500 mt-2">Un pago informado se acredita cuando la administración lo verifica contra el extracto bancario.</p></div>';
    html += '<div class="grid lg:grid-cols-2 gap-6"><div class="tarjeta"><h4 class="font-semibold mb-3">Documentos</h4>' + (r.documentos.length ? '<ul class="text-sm space-y-1">' + r.documentos.map(function (d) { var u = urlSegura(d.url); return '<li>' + (u ? '<a class="text-marca underline" target="_blank" rel="noopener" href="' + esc(u) + '">' + esc(d.titulo) + '</a>' : esc(d.titulo)) + ' <span class="text-xs text-slate-500">' + esc(d.tipo || '') + '</span></li>'; }).join('') + '</ul>' : '<p class="text-sm text-slate-500">Sin documentos habilitados.</p>') + '</div>' +
      '<div class="tarjeta"><h4 class="font-semibold mb-3">Mis solicitudes</h4>' + tablaSimple(r.solicitudes.map(function (s) { return { asunto: s.asunto, estado: s.estado, fecha: s.fecha }; }).concat(r.cesiones.map(function (s) { return { asunto: humano(s.alternativa), estado: s.estado, fecha: s.fecha_solicitud }; }))) + '</div></div>';
    c.innerHTML = html;
    $('pInformar').onclick = function () { abrirAccion({ t: 'Informar un pago', a: 'portal.informarPago', idem: true, campos: [['importe', 'moneda', 'Importe (ARS)'], ['fecha', 'fecha', 'Fecha del pago'], ['medio', 'enum', 'Medio', ['TRANSFERENCIA', 'DEPOSITO', 'OTRO']], ['referencia_bancaria', 'texto', 'N° de operación / referencia']], mostrar: function (x) { setTimeout(function () { vistaPortal(c); }, 0); return '<p>' + esc(x.mensaje) + '</p>'; } }); };
    $('pSolicitud').onclick = function () { abrirAccion({ t: 'Nueva consulta', a: 'portal.solicitud', idem: true, campos: [['asunto', 'texto', 'Asunto'], ['mensaje', 'textarea', 'Mensaje']], mostrar: function () { setTimeout(function () { vistaPortal(c); }, 0); return '<p>Consulta enviada.</p>'; } }); };
    $('pCesion').onclick = function () {
      panel('Solicitud de cesión o desvinculación', '<div class="nota mb-4">La solicitud inicia un análisis. No implica aprobación automática ni garantiza comprador, precio de salida ni reintegro. Las condiciones surgen de su contrato.</div><form id="fces" class="space-y-3">' +
        campoHtml('alternativa', 'enum', 'Alternativa', ['CESION_DERECHOS', 'SUSTITUCION_BENEFICIARIO', 'RESOLUCION_CONTRACTUAL', 'REEMBOLSO', 'OTRA']) + campoHtml('motivo', 'textarea', 'Motivo') + '<button class="boton-primario w-full">Enviar solicitud</button></form>');
      $('fces').onsubmit = function (ev) { ev.preventDefault(); llamar('portal.solicitarCesion', datosForm(this)).then(function () { aviso('Solicitud registrada.', 'ok'); cerrarPanel(); vistaPortal(c); }).catch(function (e) { aviso(e.mensaje, 'error'); }); };
    };
    Array.prototype.forEach.call(c.querySelectorAll('[data-recibo]'), function (b) { b.onclick = function () {
      llamar('portal.recibo', { pago_id: b.getAttribute('data-recibo') }).then(function (x) { panel('Recibo', mostrarRecibo(x)); }).catch(function (e) { aviso(e.mensaje, 'error'); }); }; });
  }).catch(function (e) { c.innerHTML = '<p class="text-red-600">' + esc(e.mensaje) + '</p>'; });
}

iniciar();
</script>
